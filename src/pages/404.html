<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found · Every Model</title>
<style>
  :root { --paper: #f3f5f6; --ink: #14181d; --ink-2: #434c56; }
  @media (prefers-color-scheme: dark) { :root { --paper: #0e1114; --ink: #e6eaee; --ink-2: #b0b8c1; } }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--paper); color: var(--ink);
         font: 18px/1.6 "Source Serif 4", Georgia, serif; padding-inline: 16px; }
  main { max-width: 34rem; }
  h1 { font: 800 2.4rem/1.1 "Archivo", "Helvetica Neue", Arial, sans-serif; letter-spacing: -0.03em; margin: 0 0 12px; }
  p { color: var(--ink-2); margin: 0 0 16px; }
  a { color: var(--ink); }
</style>
</head>
<body>
<main>
  <h1>That page isn't here</h1>
  <p>The link may point at a chapter that hasn't landed yet. The course map lists every chapter, and the timeline lists every architecture.</p>
  <p><a id="home" href="/">Go to the course map</a></p>
</main>
<script>
  var seg = location.pathname.split("/").filter(Boolean)[0];
  if (seg && location.hostname.endsWith("github.io")) document.getElementById("home").href = "/" + seg + "/";
</script>
</body>
</html>
